    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:presenter-assign
    summary: 'Server -> all sockets in the namespace: a new presenter was assigned.'
    description: >-
      Emitted when the first member joins (first-join), when an admin takes over or a presenter/admin reassigns via
      collab:presenter-takeover (admin-takeover), and when the presenter disconnects and control transfers to an admin
      or the earliest joined member (transfer-on-leave).
    messages:
      - $ref: '#/channels/collab/messages/collab-presenter-assign'
    x-socket-event: collab:presenter-assign
  receive-collab-presenter-state:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:presenter-state
    summary: 'Server -> joining socket: current presenter and playback state when a presenter already exists.'
    description: Sent instead of collab:presenter-assign to a socket that joins a namespace that already has a presenter.
    messages:
      - $ref: '#/channels/collab/messages/collab-presenter-state'
    x-socket-event: collab:presenter-state
  send-collab-presenter-request:
    action: send
    channel:
      $ref: '#/channels/collab'
    title: Emit collab:presenter-request
    summary: >-
      Request for presenter control. From an admin it is granted immediately (collab:presenter-assign, reason
      admin-takeover); from a non-admin it is relayed to the current presenter socket only.
    description: >-
      Client emits collab:presenter-request (any data). Client -> server -> the current presenter socket only. The
      server spreads the client payload and appends the authenticated user identity (userId, displayName, color,
      avatarUrl), the annotationColor assigned on collab:join and a timestamp; client supplied values for those keys are
      overwritten. requesterId / requesterDisplayName duplicate userId / displayName.
    messages:
      - $ref: '#/channels/collab/messages/collab-presenter-request'
    x-socket-event: collab:presenter-request
  receive-collab-presenter-request:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:presenter-request
    summary: >-
      Request for presenter control. From an admin it is granted immediately (collab:presenter-assign, reason
      admin-takeover); from a non-admin it is relayed to the current presenter socket only.
    description: >-
      Client emits collab:presenter-request (any data). Client -> server -> the current presenter socket only. The
      server spreads the client payload and appends the authenticated user identity (userId, displayName, color,
      avatarUrl), the annotationColor assigned on collab:join and a timestamp; client supplied values for those keys are
      overwritten. requesterId / requesterDisplayName duplicate userId / displayName.
    messages:
      - $ref: '#/channels/collab/messages/collab-presenter-request'
    x-socket-event: collab:presenter-request
  send-collab-presenter-takeover:
    action: send
    channel:
      $ref: '#/channels/collab'
    title: Emit collab:presenter-takeover
    summary: >-
      Client -> server only: an admin or the current presenter hands presenter control to a target user. Results in a
      collab:presenter-assign (reason admin-takeover) to everyone; nothing is relayed under this name.
    description: >-
      Client payload: { targetUserId: string, targetDisplayName: string }. Ignored when the sender is neither an admin
      (workspaceOwner/workspaceAdmin/projectOwner/projectAdmin) nor the current presenter, or when targetUserId is
      missing.
    messages:
      - $ref: '#/channels/collab/messages/collab-presenter-takeover'
    x-socket-event: collab:presenter-takeover
  send-collab-state-request:
    action: send
    channel:
      $ref: '#/channels/collab'
    title: Emit collab:state-request
    summary: >-
      Server -> the earliest joined other member: asks it to send its current annotation state to a late joiner
      (collab:state-response).
    description: >-
      Emitted automatically when a socket joins a namespace with existing members, and again when a client retries by
      emitting collab:state-request itself.
    messages:
      - $ref: '#/channels/collab/messages/collab-state-request'
    x-socket-event: collab:state-request
  receive-collab-state-request:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:state-request
    summary: >-
      Server -> the earliest joined other member: asks it to send its current annotation state to a late joiner
      (collab:state-response).
    description: >-
      Emitted automatically when a socket joins a namespace with existing members, and again when a client retries by
      emitting collab:state-request itself.
    messages:
      - $ref: '#/channels/collab/messages/collab-state-request'
    x-socket-event: collab:state-request
  send-collab-state-response:
    action: send
    channel:
      $ref: '#/channels/collab'
    title: Emit collab:state-response
    summary: >-
      Server -> the requesting socket only: sanitised snapshot of paths, regions and zoom provided by an existing
      member.
    description: >-
      Client emits collab:state-response with { requesterSocketId, paths, regions, zoom }; the server
      validates/truncates (max 200 paths and 200 regions, string length limits) and forwards it only to
      requesterSocketId.
    messages:
      - $ref: '#/channels/collab/messages/collab-state-response'
    x-socket-event: collab:state-response
  receive-collab-state-response:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:state-response
    summary: >-
      Server -> the requesting socket only: sanitised snapshot of paths, regions and zoom provided by an existing
      member.
    description: >-
      Client emits collab:state-response with { requesterSocketId, paths, regions, zoom }; the server
      validates/truncates (max 200 paths and 200 regions, string length limits) and forwards it only to
      requesterSocketId.
    messages:
      - $ref: '#/channels/collab/messages/collab-state-response'
    x-socket-event: collab:state-response
  receive-collab-members:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:members
    summary: 'Server -> joining socket: the members already present in the namespace.'
    description: Sent right after collab:join when at least one other authenticated member is connected.
    messages:
      - $ref: '#/channels/collab/messages/collab-members'
    x-socket-event: collab:members
  receive-collab-self-color:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:self-color
    summary: 'Server -> joining socket: the annotation colour assigned to it for this session.'
    description: >-
      The preferred colour is kept when it is not the default (#FF0000); otherwise the first unused palette colour is
      assigned.
    messages:
      - $ref: '#/channels/collab/messages/collab-self-color'
    x-socket-event: collab:self-color
components:
  messages:
    test:
      name: test
      title: test
      summary: Event used for testing websocket connections.
      description: |-
        Event used for testing websocket connections.

        Test event payload. Changes key structure will depend on test scenario.

        Delivered as the `notification` socket event with `type` set to `test`.
      payload:
        description: Event used for testing websocket connections.
        allOf:
          - $ref: '#/components/schemas/BaseNotificationEvent'
          - type: object
            properties:
              tokens:
                type: object
                properties:
                  testData:
                    type: string
                    description: Arbitrary data sent for testing.
                required:
                  - testData
      x-notification-tokens:
        - testData
    notificationUpdate:
      name: notificationUpdate
      title: notificationUpdate
      summary: >-
        Indicates that a previously delivered, grouped notification has been updated (assetGroupUploadComplete or
        projectGroupItemPublish).
      description: >-
        Fired when a grouped notification accumulates another item within its grouping window. The full updated
        notification is in tokens.updatedNotification; the changes object is not populated for this event.


        Payload for the notificationUpdate event.


        Delivered as the `notification` socket event with `type` set to `notificationUpdate`.
      payload:
        description: >-
          Fired when a grouped notification accumulates another item within its grouping window. The full updated
          notification is in tokens.updatedNotification; the changes object is not populated for this event.
        allOf:
          - $ref: '#/components/schemas/BaseNotificationEvent'
          - type: object
            properties:
              tokens:
                type: object
                properties:
                  notificationId:
                    type: string
                    format: uuid
                    description: ID of the notification that was updated.
                  originalNotification:
                    type: object
                    description: The notification object before the update.
                  updatedNotification:
                    type: object
                    description: >-
                      The notification object after the update (tokens.assets / tokens.items and changes.update
                      extended).
                required:
                  - notificationId
                  - originalNotification
                  - updatedNotification
          - type: object
            properties:
              changes:
                type: object
                description: Not populated for this event (the notification is created without a changes object).
      x-notification-tokens:
        - notificationId
        - originalNotification
        - updatedNotification
    workspaceCreate:
      name: workspaceCreate
      title: workspaceCreate
      summary: Fired when a new workspace is created.
      description: >-
        Fired when a new workspace is created.


        Payload for the workspace create event. Includes new workspace object in changes.create array.


        Delivered as the `notification` socket event with `type` set to `workspaceCreate`.


        Token keys marked with (*) will be deprecated in a future release and should not be used for new development;
        replace them with the values and objects in the `changes` key in existing implementations.
      payload:
        description: Fired when a new workspace is created.
        allOf:
          - $ref: '#/components/schemas/BaseNotificationEvent'
          - type: object
            properties:
              tokens:
                type: object
                properties:
                  (*)newWorkspace:
                    type: object
                    description: Deprecated. Use resource from changes.create.
                required:
                  - newWorkspace
          - type: object
            properties:
              changes:
                type: object
                properties:
                  create:
                    type: array
                    items:
                      type: object
                      properties:
                        resourceId:
                          type: string
                          format: uuid
                        resourceType:
                          type: string
                          value: workspace
                        resource:
                          type: object
                          description: New workspace object.
                required:
                  - create
      x-notification-tokens:
        - newWorkspace
    workspaceUpdate:
      name: workspaceUpdate
      title: workspaceUpdate
      summary: Fired when a workspace name is changed.
      description: >-
        Fired when a workspace name is changed.


        Payload for the workspace name change event.


        Delivered as the `notification` socket event with `type` set to `workspaceUpdate`.


        Token keys marked with (*) will be deprecated in a future release and should not be used for new development;
        replace them with the values and objects in the `changes` key in existing implementations.
      payload:
        description: Fired when a workspace name is changed.
        allOf:
          - $ref: '#/components/schemas/BaseNotificationEvent'
          - type: object
            properties:
              tokens:
                type: object
                properties:
                  (*)requesterId:
                    type: string
                    format: uuid
                  (*)requester:
                    type: object
                  (*)workspaceId:
                    type: string
                    format: uuid
                  oldWorkspaceName:
                    type: string
                  newWorkspaceName:
                    type: string
                required:
                  - requesterId
                  - requester
                  - workspaceId
                  - oldWorkspaceName
                  - newWorkspaceName
          - type: object
            properties:
              changes:
                type: object
                properties:
                  update:
                    type: array
                    items:
                      type: object
                      properties:
                        resourceId:
                          type: string
                          format: uuid
                        resourceType:
                          type: string
                          value: workspace
                        resource:
                          type: object
                          description: Updated workspace object.
                required:
                  - update
      x-notification-tokens:
        - requesterId
        - requester
        - workspaceId
        - oldWorkspaceName
        - newWorkspaceName
    workspaceDelete:
      name: workspaceDelete
      title: workspaceDelete
      summary: Fired when a workspace is marked for deletion.
      description: >-
        Fired when a workspace is marked for deletion.


        Payload for the workspace delete event.


        Delivered as the `notification` socket event with `type` set to `workspaceDelete`.


        Token keys marked with (*) will be deprecated in a future release and should not be used for new development;
        replace them with the values and objects in the `changes` key in existing implementations.
      payload:
        description: Fired when a workspace is marked for deletion.
        allOf:
          - $ref: '#/components/schemas/BaseNotificationEvent'
          - type: object
            properties:
              tokens:
                type: object
                properties:
                  (*)requesterId:
                    type: string
                    format: uuid
                  (*)requester:
                    type: object
                  (*)workspaceId:
                    type: string
                    format: uuid
                  workspaceName:
                    type: string
                required:
                  - requesterId
                  - requester
                  - workspaceId
                  - workspaceName
          - type: object
            properties:
              changes:
                type: object
                properties:
                  delete:

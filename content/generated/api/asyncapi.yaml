      title: collab:playback-sync
      summary: Play/pause/seek state broadcast by the presenter to the other members.
      description: >-
        Only the current presenter socket may broadcast; other senders receive collab:playback-sync:rejected instead and
        nothing is relayed. Client -> server -> all other sockets in the same /chat/{chatId} namespace. The server
        spreads the client payload and appends the authenticated user identity (userId, displayName, color, avatarUrl),
        the annotationColor assigned on collab:join and a timestamp; client supplied values for those keys are
        overwritten. The server also stores currentTime/playing as the namespace playback state.


        Payload of the 'collab:playback-sync' socket event.
      payload:
        description: >-
          Only the current presenter socket may broadcast; other senders receive collab:playback-sync:rejected instead
          and nothing is relayed. Client -> server -> all other sockets in the same /chat/{chatId} namespace. The server
          spreads the client payload and appends the authenticated user identity (userId, displayName, color,
          avatarUrl), the annotationColor assigned on collab:join and a timestamp; client supplied values for those keys
          are overwritten. The server also stores currentTime/playing as the namespace playback state.
        type: object
        properties:
          action:
            type: string
            description: Client supplied action (e.g. 'play', 'pause', 'seek').
          currentTime:
            type: number
          playing:
            type: boolean
          duration:
            type: number
          playbackRate:
            type: number
          userId:
            type: string
            description: Authenticated user ID (server supplied, cannot be spoofed).
          displayName:
            type: string
            nullable: true
            description: Display name (falls back to first + last name).

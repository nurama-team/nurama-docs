        server spreads the client payload and appends the authenticated user identity (userId, displayName, color,
        avatarUrl), the annotationColor assigned on collab:join and a timestamp; client supplied values for those keys
        are overwritten. requesterId / requesterDisplayName duplicate userId / displayName.



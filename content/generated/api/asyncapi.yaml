      title: collab:state-request
      summary: >-
        Server -> the earliest joined other member: asks it to send its current annotation state to a late joiner
        (collab:state-response).
      description: >-
        Emitted automatically when a socket joins a namespace with existing members, and again when a client retries by
        emitting collab:state-request itself.


        Payload of the 'collab:state-request' socket event.
      payload:
        description: >-
          Emitted automatically when a socket joins a namespace with existing members, and again when a client retries
          by emitting collab:state-request itself.
        type: object
        properties:
          requesterId:
            type: string
            description: User ID of the late joiner.
          requesterSocketId:
            type: string
            description: Socket ID to address the collab:state-response to.

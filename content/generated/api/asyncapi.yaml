          - tokenBlacklisted
    ws-probe:
      name: ws:probe
      title: ws:probe
      summary: >-
        Client -> server liveness probe. Emit with an acknowledgement callback; the server acks immediately with no
        payload.
      description: >-
        Client emits ws:probe (any/no data) using socket.io acks, e.g. socket.timeout(2000).emit('ws:probe', null, (err)
        => ...). A missing ack means the connection is stale and should be torn down. Nothing is emitted by the server
        other than the ack.


        Acknowledgement only; the server sends no payload.
      payload:
        description: >-
          Client emits ws:probe (any/no data) using socket.io acks, e.g. socket.timeout(2000).emit('ws:probe', null,
          (err) => ...). A missing ack means the connection is stale and should be torn down. Nothing is emitted by the
          server other than the ack.
        type: object
        additionalProperties: false

    channel:
      $ref: '#/channels/collab'
    title: Emit collab:playback-sync
    summary: Play/pause/seek state broadcast by the presenter to the other members.
    description: >-
      Only the current presenter socket may broadcast; other senders receive collab:playback-sync:rejected instead and
      nothing is relayed. Client -> server -> all other sockets in the same /chat/{chatId} namespace. The server spreads
      the client payload and appends the authenticated user identity (userId, displayName, color, avatarUrl), the
      annotationColor assigned on collab:join and a timestamp; client supplied values for those keys are overwritten.
      The server also stores currentTime/playing as the namespace playback state.
    messages:
      - $ref: '#/channels/collab/messages/collab-playback-sync'
    x-socket-event: collab:playback-sync
  receive-collab-playback-sync:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:playback-sync
    summary: Play/pause/seek state broadcast by the presenter to the other members.
    description: >-
      Only the current presenter socket may broadcast; other senders receive collab:playback-sync:rejected instead and
      nothing is relayed. Client -> server -> all other sockets in the same /chat/{chatId} namespace. The server spreads
      the client payload and appends the authenticated user identity (userId, displayName, color, avatarUrl), the
      annotationColor assigned on collab:join and a timestamp; client supplied values for those keys are overwritten.

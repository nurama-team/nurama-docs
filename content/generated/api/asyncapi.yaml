  receive-tokenEvent:
    action: receive
    channel:
      $ref: '#/channels/resource'
    title: Receive tokenEvent
    summary: Emitted by the server right before it force-disconnects a socket whose credential is no longer valid.
    description: >-
      Payload is a plain string, not an object. 'TokenExpired' is sent when the JWT exp has passed, 'tokenBlacklisted'
      when the JWT was blacklisted (logout) or a bot API key was revoked. The socket is disconnected ~1 second later;
      re-authenticate and reconnect.
    messages:
      - $ref: '#/channels/resource/messages/tokenEvent'
    x-socket-event: tokenEvent
  send-ws-probe:
    action: send
    channel:
      $ref: '#/channels/resource'
    title: Emit ws:probe
    summary: >-
      Client -> server liveness probe. Emit with an acknowledgement callback; the server acks immediately with no
      payload.
    description: >-
      Client emits ws:probe (any/no data) using socket.io acks, e.g. socket.timeout(2000).emit('ws:probe', null, (err)
      => ...). A missing ack means the connection is stale and should be torn down. Nothing is emitted by the server
      other than the ack.
    messages:
      - $ref: '#/channels/resource/messages/ws-probe'
    x-socket-event: ws:probe
  send-typing-start:
    action: send
    channel:
      $ref: '#/channels/resource'
    title: Emit typing:start
    summary: >-
      Ephemeral typing indicator. Client -> server: emit { chatId }. Server -> clients: relayed with the authenticated
      userId to every other socket on the chat channels.
    description: >-
      Client emits typing:start with { chatId: string }. The server resolves the same channels a chatCreateMessage for
      that chat would use (chat/{chatId}, project/{projectId}/{visibility}, public/{token}; never user/* channels) and
      emits typing:start on each of them to every socket except the sender. Not persisted; not delivered as a
      'notification' event.
    messages:
      - $ref: '#/channels/resource/messages/typing-start'
    x-socket-event: typing:start
  receive-typing-start:
    action: receive
    channel:
      $ref: '#/channels/resource'
    title: Receive typing:start
    summary: >-

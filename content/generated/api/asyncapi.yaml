    x-socket-event: typing:stop
  send-collab-join:
    action: send
    channel:
      $ref: '#/channels/collab'
    title: Emit collab:join
    summary: A user joined the collab session on this chat namespace (broadcast to the other members).
    description: >-
      Client emits collab:join with optional { preferredAnnotationColor }. Client -> server -> all other sockets in the
      same /chat/{chatId} namespace. The server spreads the client payload and appends the authenticated user identity
      (userId, displayName, color, avatarUrl), the annotationColor assigned on collab:join and a timestamp; client
      supplied values for those keys are overwritten. The joining socket additionally receives collab:self-color,
      collab:members (if others are present) and either collab:presenter-assign (first member) or
      collab:presenter-state.
    messages:
      - $ref: '#/channels/collab/messages/collab-join'
    x-socket-event: collab:join
  receive-collab-join:
    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:join
    summary: A user joined the collab session on this chat namespace (broadcast to the other members).
    description: >-

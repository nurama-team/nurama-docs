    action: receive
    channel:
      $ref: '#/channels/collab'
    title: Receive collab:playback-sync:rejected
    summary: >-
      Server -> sender only: the sender is not the presenter, so its collab:playback-sync was dropped. Carries the real
      presenter and playback position so the client can snap back to follower mode.
    description: Emitted only to the rejected sender.
    messages:
      - $ref: '#/channels/collab/messages/collab-playback-sync-rejected'
    x-socket-event: collab:playback-sync:rejected

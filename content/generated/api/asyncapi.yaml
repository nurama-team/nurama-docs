asyncapi: 3.0.0
info:
  title: Nurama WebSocket API
  version: 0.3.3
  description: >-
    Socket.IO events of the Nurama websocket server. Generated from `src/docs/websocket.yml` and
    `src/config/notifications.js` by `src/docs/buildAsyncApi.js`; edit those sources, not this document.


    Websocket (Socket.io) events emitted by the websocket server (started with `pnpm ws`, hosted separately from the
    REST API). 


    **Connecting / channels.** Every channel is a Socket.io namespace named
    `/{resourceType}/{resourceId}[/{visibility}]`, where resourceType is one of workspace, project, user, chat, asset,
    submission, task or public, resourceId is a UUID (or legacy 24-char hex id) and the optional visibility is creator,
    reviewer or public. Public release channels are `/public/{token}` (10-character public token, no visibility suffix).
    Any other namespace is refused. Authenticate by passing `query: { token }` on the handshake: a user JWT, a personal
    access token or a bot API key (bot keys must connect through a configured bot gateway hostname). `/public/{token}`
    namespaces need no handshake token (the token in the namespace is validated instead); authenticated users may also
    join them. Failures surface as `connect_error` with message `forbidden` (invalid credentials or no permission) or
    `badRequest` (malformed channel / permission lookup error). 


    **Permissions.** A user may only join their own `/user/{userId}`. `/project/{id}/creator`, `/reviewer` and `/public`
    require canGetProjectCreatorNotifications, canGetProjectReviewerNotifications and canGetProjectPublicNotifications
    respectively; every other channel requires canGet{ResourceType}Notifications (direct or inherited). 


    **Server -> client events:** `notification` (every notification event documented below, emitted on each channel in
    the notification's channels list; the payload `type` selects the schema), `tokenEvent`, `typing:start` /
    `typing:stop` and the `collab:*` events (only on `/chat/{chatId}` namespaces). **Client -> server events:**
    `ws:probe`, `typing:start` / `typing:stop`, `collab:*`. Notifications are delivered via PostgreSQL LISTEN/NOTIFY
    with a polling fallback; sockets whose JWT expired or was blacklisted, or whose bot key was revoked, receive
    `tokenEvent` and are disconnected shortly after. 


    Each event type below is documented using 'get' to represent the emitted event payload under the '200' response
    schema. **Keys marked with (*) will be deprecated in a future release and should not be used for new development and
    should be replaced with values and objects in the changes key in existing implementations.**
defaultContentType: application/json
servers:
  local:
    host: localhost:4000
    protocol: ws
    pathname: /socket.io
    description: >-
      Local websocket server started with `pnpm ws` (port from WS_PORT). Socket.IO transport: connect with a Socket.IO
      client to the namespace (channel) address, not with a raw WebSocket.
    security:
      - $ref: '#/components/securitySchemes/handshakeToken'
  hosted:
    host: '{host}'
    protocol: wss
    pathname: /socket.io
    description: Staging / production websocket server over TLS (Socket.IO), hosted separately from the REST API.
    variables:
      host:
        description: >-
          Hostname of the staging or production websocket server. It is not part of the API configuration, so it is left
          as a variable.
    security:
      - $ref: '#/components/securitySchemes/handshakeToken'
channels:
  resource:
    address: /{resourceType}/{resourceId}/{visibility}
    title: Resource namespace
    summary: Notifications for one workspace, project, user, chat, asset, submission or task.
    description: >-
      Socket.IO namespace named after the resource. The `/{visibility}` segment is optional: connect to
      `/{resourceType}/{resourceId}` for the default channel. Requires a handshake `token`. A user may only join their
      own `/user/{userId}`; `/project/{id}/creator`, `/reviewer` and `/public` require
      canGetProjectCreatorNotifications, canGetProjectReviewerNotifications and canGetProjectPublicNotifications; every
      other channel requires canGet{ResourceType}Notifications (direct or inherited).
    parameters:
      resourceType:
        enum:
          - workspace
          - project
          - user
          - chat
          - asset
          - submission
          - task
        description: Type of the resource whose events to receive.
      resourceId:
        description: UUID (or legacy 24-character hex id) of the resource.
      visibility:
        enum:
          - creator
          - reviewer
          - public
        description: Optional visibility sub-channel; omit the segment for the default channel.

        description: >-
          The preferred colour is kept when it is not the default (#FF0000); otherwise the first unused palette colour
          is assigned.
        type: object
        properties:
          annotationColor:
            type: string
  schemas:
    BaseNotificationEvent:
      type: object
      properties:
        type:
          type: string
          description: >-
            The specific type of notification event (matches the top-level key, e.g., 'workspaceCreate'). Every value in
            notificationTemplates (config/notifications.js) is documented in this tag.
        initiatorId:
          type: string
          format: uuid
          description: ID of the user or system that initiated the event. Null if initiatorType is 'system'.
        initiatorType:
          type: string
          enum:
            - user
            - system
          description: Type of initiator (user or system).
        initiator:
          type: object
          description: Populated initiator user object (if initiatorType is 'user').
          nullable: true
        resourceId:
          type: string
          format: uuid
          description: ID of the primary resource this notification pertains to.
        resourceType:
          type: string
          description: Type of the primary resource this notification pertains to.
        channels:
          type: array
          items:
            type: string
          description: >-
            The specific channels this notification was published on. Present on notification objects returned by the
            REST API only; the socket 'notification' payload omits it (and id).
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the notification was created.
      required:
        - type
        - initiatorType
        - resourceId
        - resourceType
        - createdAt
  securitySchemes:
    handshakeToken:
      type: httpApiKey
      name: token
      in: query
      description: >-
        Socket.IO handshake query parameter (`io(url, { query: { token } })`): a user JWT, a personal access token or a
        bot API key (bot keys must connect through a configured bot gateway hostname). Not needed on `/public/{token}`
        namespaces. Invalid credentials or a missing permission fail the connection with `connect_error` "forbidden"; a
        malformed namespace or permission lookup error with "badRequest".

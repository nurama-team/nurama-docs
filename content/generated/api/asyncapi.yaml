      name: collab:playback-sync:rejected
      title: collab:playback-sync:rejected
      summary: >-
        Server -> sender only: the sender is not the presenter, so its collab:playback-sync was dropped. Carries the
        real presenter and playback position so the client can snap back to follower mode.
      description: |-
        Emitted only to the rejected sender.

        Payload of the 'collab:playback-sync:rejected' socket event.
      payload:
        description: Emitted only to the rejected sender.
        type: object
        properties:
          reason:
            type: string
            enum:
              - not-presenter
          presenterId:
            type: string
            nullable: true
          presenterDisplayName:
            type: string
            nullable: true
          playback:
            type: object
            description: '{ currentTime: number, playing: boolean } of the current presenter.'
          timestamp:

      payload:
        description: >-
          Fired when a group of assets finishes uploading within a defined time window. Subsequent uploads in the window
          update this notification (tokens.assets and tokens.uploadCount grow) and emit notificationUpdate.
        allOf:
          - $ref: '#/components/schemas/BaseNotificationEvent'
          - type: object
            properties:
              tokens:
                type: object
                properties:
                  (*)creatorId:
                    type: string
                    format: uuid
                    description: Deprecated. Use initiatorId.
                  (*)creator:
                    type: object
                    description: Deprecated. Public user object of the uploader. Use initiator.
                  visibility:
                    type: array
                    items:
                      type: string
                    description: Visibility of the uploaded asset(s).
                  (*)assets:
                    type: array
                    items:
                      type: object
                    description: Deprecated. Uploaded asset objects. Use resources from changes.update.
                  uploadCount:
                    type: integer
                    description: Number of assets accumulated in this group so far.
                required:
                  - creatorId
                  - creator
                  - visibility
                  - assets
                  - uploadCount
          - type: object
            properties:
              changes:
                type: object

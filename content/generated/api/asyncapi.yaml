                type: object
                description: Event specific create/update/delete arrays (see the individual event). May be null.
                nullable: true
    tokenEvent:
      name: tokenEvent
      title: tokenEvent
      summary: Emitted by the server right before it force-disconnects a socket whose credential is no longer valid.
      description: >-
        Payload is a plain string, not an object. 'TokenExpired' is sent when the JWT exp has passed, 'tokenBlacklisted'
        when the JWT was blacklisted (logout) or a bot API key was revoked. The socket is disconnected ~1 second later;
        re-authenticate and reconnect.


        Payload of the 'tokenEvent' socket event.
      payload:
        description: >-
          Payload is a plain string, not an object. 'TokenExpired' is sent when the JWT exp has passed,
          'tokenBlacklisted' when the JWT was blacklisted (logout) or a bot API key was revoked. The socket is
          disconnected ~1 second later; re-authenticate and reconnect.
        type: string
        enum:

            type: integer
    collab-state-response:
      name: collab:state-response
      title: collab:state-response
      summary: >-
        Server -> the requesting socket only: sanitised snapshot of paths, regions and zoom provided by an existing
        member.
      description: >-
        Client emits collab:state-response with { requesterSocketId, paths, regions, zoom }; the server
        validates/truncates (max 200 paths and 200 regions, string length limits) and forwards it only to
        requesterSocketId.


        Payload of the 'collab:state-response' socket event.
      payload:
        description: >-
          Client emits collab:state-response with { requesterSocketId, paths, regions, zoom }; the server
          validates/truncates (max 200 paths and 200 regions, string length limits) and forwards it only to
          requesterSocketId.
        type: object
        properties:
          requesterSocketId:
            type: string
          paths:
            type: array
            items:
              type: object
            description: 'Path objects: { pathId, userId, color, strokeWidth, pathData, fadeDuration, createdAt }.'
          regions:
            type: array
            items:
              type: object
            description: 'Region objects: { regionId, startTime, endTime, userId, displayName, color, avatarUrl }.'
          zoom:
            type: number
            description: Zoom level, omitted when the responder did not supply a number.
          timestamp:
            type: integer
    collab-members:
      name: collab:members
      title: collab:members
      summary: 'Server -> joining socket: the members already present in the namespace.'
      description: |-
        Sent right after collab:join when at least one other authenticated member is connected.

        Payload of the 'collab:members' socket event.
      payload:
        description: Sent right after collab:join when at least one other authenticated member is connected.

    collab-presenter-takeover:
      name: collab:presenter-takeover
      title: collab:presenter-takeover
      summary: >-
        Client -> server only: an admin or the current presenter hands presenter control to a target user. Results in a
        collab:presenter-assign (reason admin-takeover) to everyone; nothing is relayed under this name.
      description: >-
        Client payload: { targetUserId: string, targetDisplayName: string }. Ignored when the sender is neither an admin
        (workspaceOwner/workspaceAdmin/projectOwner/projectAdmin) nor the current presenter, or when targetUserId is
        missing.


        Client -> server payload (no server emission under this event name).
      payload:
        description: >-
          Client payload: { targetUserId: string, targetDisplayName: string }. Ignored when the sender is neither an
          admin (workspaceOwner/workspaceAdmin/projectOwner/projectAdmin) nor the current presenter, or when
          targetUserId is missing.
        type: object
        properties:

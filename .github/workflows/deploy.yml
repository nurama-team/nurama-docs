name: Deploy

# Builds the static site and publishes it to Cloudflare Workers (static assets).
# Runs on every push to main, including the generated-content syncs from the monorepo.
#
# Required configuration:
#   secrets.CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" on the account
#   vars.CLOUDFLARE_ACCOUNT_ID     the Cloudflare account id

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
